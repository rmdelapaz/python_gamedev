<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cf-title cf-desc">
    <title id="cf-title">Coyote time and jump buffering</title>
    <desc id="cf-desc">Two stacked timelines explain input-forgiveness windows in a platformer controller. The top timeline, coyote time, shows a player stepping off a ledge; a short amber grace window of about one tenth of a second follows the moment they leave the ground, and a jump pressed inside that window still launches a jump, while a press after it is too late and the player just falls. The bottom timeline, jump buffer, shows a player falling toward the ground; a jump pressed in mid-air is remembered for a short buffer window of about 0.12 seconds, so when the player lands within that window the jump fires the instant they touch down.</desc>

    <style>
        :root {
            --axis: #64748b;
            --tick: #475569;
            --ground: #10b981;
            --ground-top: #34d399;
            --player: #2563eb;
            --window: #f59e0b;
            --window-fill: rgba(245, 158, 11, 0.20);
            --ok: #10b981;
            --late: #94a3b8;
            --text: rgb(30, 41, 59);
            --sub-text: rgb(71, 85, 105);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --axis: #94a3b8;
                --tick: #cbd5e1;
                --ground: #059669;
                --ground-top: #34d399;
                --player: #60a5fa;
                --window: #fbbf24;
                --window-fill: rgba(251, 191, 36, 0.22);
                --ok: #34d399;
                --late: #64748b;
                --text: #f1f5f9;
                --sub-text: #cbd5e1;
            }
        }
        .title { fill: var(--text); font: 700 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .axis { stroke: var(--axis); stroke-width: 2.5; stroke-linecap: round; }
        .tick { stroke: var(--tick); stroke-width: 2.5; }
        .win { fill: var(--window-fill); stroke: var(--window); stroke-width: 2; stroke-dasharray: 6 4; }
        .ground { fill: var(--ground); }
        .ground-top { fill: var(--ground-top); }
        .body { fill: var(--player); }
        .ok-dot { fill: var(--ok); }
        .late-dot { fill: var(--late); }
        .lbl { fill: var(--sub-text); font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .win-lbl { fill: var(--window); font: 700 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .ok-lbl { fill: var(--ok); font: 800 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .late-lbl { fill: var(--late); font: 700 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>

    <!-- ============ Coyote time ============ -->
    <text class="title" x="360" y="30" text-anchor="middle">Coyote time &#8212; jump just after you leave the ledge</text>

    <!-- mini scene: ledge + player stepping off -->
    <rect class="ground" x="45" y="112" width="95" height="42"/>
    <rect class="ground-top" x="45" y="112" width="95" height="5"/>
    <rect class="body" x="118" y="86" width="18" height="24" rx="4"/>
    <circle class="body" cx="127" cy="78" r="9"/>

    <!-- timeline -->
    <line class="axis" x1="175" y1="150" x2="680" y2="150"/>
    <!-- leaves ground marker -->
    <line class="tick" x1="225" y1="138" x2="225" y2="162"/>
    <text class="lbl" x="225" y="128" text-anchor="middle">leaves ledge</text>
    <!-- grace window -->
    <rect class="win" x="225" y="140" width="150" height="20" rx="4"/>
    <text class="win-lbl" x="300" y="182" text-anchor="middle">grace window &#8776; 0.1 s</text>
    <!-- jump inside window -->
    <circle class="ok-dot" cx="330" cy="150" r="7"/>
    <text class="ok-lbl" x="330" y="204" text-anchor="middle">Jump pressed &#8594; still jumps &#10003;</text>
    <!-- too late marker -->
    <line class="tick" x1="470" y1="140" x2="470" y2="160" stroke="var(--late)"/>
    <circle class="late-dot" cx="470" cy="150" r="6"/>
    <text class="late-lbl" x="470" y="128" text-anchor="middle">later &#8594; too late, you fall &#10007;</text>

    <!-- divider -->
    <line x1="60" y1="238" x2="660" y2="238" stroke="var(--axis)" stroke-width="1" opacity="0.3"/>

    <!-- ============ Jump buffer ============ -->
    <text class="title" x="360" y="272" text-anchor="middle">Jump buffer &#8212; press just before you land</text>

    <!-- mini scene: falling player + ground -->
    <rect class="body" x="96" y="300" width="18" height="24" rx="4"/>
    <circle class="body" cx="105" cy="292" r="9"/>
    <rect class="ground" x="45" y="352" width="105" height="30"/>
    <rect class="ground-top" x="45" y="352" width="105" height="5"/>

    <!-- timeline -->
    <line class="axis" x1="175" y1="360" x2="680" y2="360"/>
    <!-- jump pressed in air -->
    <line class="tick" x1="250" y1="348" x2="250" y2="372"/>
    <text class="lbl" x="250" y="338" text-anchor="middle">Jump pressed (mid-air)</text>
    <!-- buffer window -->
    <rect class="win" x="250" y="350" width="150" height="20" rx="4"/>
    <text class="win-lbl" x="325" y="393" text-anchor="middle">buffer window &#8776; 0.12 s</text>
    <!-- lands inside window -->
    <line class="tick" x1="375" y1="348" x2="375" y2="372"/>
    <text class="lbl" x="375" y="338" text-anchor="middle">lands</text>
    <circle class="ok-dot" cx="375" cy="360" r="7"/>
    <text class="ok-lbl" x="410" y="415" text-anchor="middle">&#8594; jump fires the instant you touch down &#10003;</text>
</svg>
