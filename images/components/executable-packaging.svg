<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pkg-title pkg-desc">
    <title id="pkg-title">A bundler packing source, interpreter, libraries, and assets into one executable</title>
    <desc id="pkg-desc">On the left, four stacked inputs: your Python source, the Python interpreter, pygame and its libraries, and the game assets folder. Arrows carry all four into a central rounded box labelled PyInstaller or Nuitka, the bundler. A single arrow leaves it to a box on the right labelled game.exe, one standalone file. A note underneath states the player needs no Python installed.</desc>

    <style>
        :root {
            --text: rgb(30, 41, 59);
            --sub-text: rgb(71, 85, 105);
            --src: #569cd6;
            --sys: #94a3b8;
            --asset: #10b981;
            --bundler: rgb(245, 158, 11);
            --bundler-text: rgb(120, 53, 15);
            --out: #3b82f6;
            --arrow: #64748b;
            --box-bg: #f8fafc;
            --stroke: #cbd5e1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f1f5f9;
                --sub-text: #cbd5e1;
                --src: #569cd6;
                --sys: #64748b;
                --asset: #34d399;
                --bundler: #fbbf24;
                --bundler-text: rgb(30, 20, 5);
                --out: #60a5fa;
                --arrow: #94a3b8;
                --box-bg: #1e293b;
                --stroke: #475569;
            }
        }
        .in-box { fill: var(--box-bg); stroke: var(--stroke); stroke-width: 1.5; }
        .swatch-src { fill: var(--src); }
        .swatch-sys { fill: var(--sys); }
        .swatch-asset { fill: var(--asset); }
        .in-label { fill: var(--text); font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .in-sub { fill: var(--sub-text); font: 500 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .bundler { fill: var(--bundler); }
        .bundler-label { fill: var(--bundler-text); font: 800 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .bundler-sub { fill: var(--bundler-text); font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .out-box { fill: var(--out); }
        .out-label { fill: #ffffff; font: 800 18px ui-monospace, "SFMono-Regular", Consolas, monospace; }
        .out-sub { fill: #eff6ff; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .arrow { stroke: var(--arrow); stroke-width: 2.5; fill: none; }
        .caption { fill: var(--sub-text); font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>

    <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="var(--arrow)"/>
        </marker>
    </defs>

    <!-- input stack -->
    <g>
        <rect class="in-box" x="24" y="44" width="176" height="44" rx="7"/>
        <rect class="swatch-src" x="36" y="56" width="20" height="20" rx="4"/>
        <text class="in-label" x="66" y="64">your_game.py</text>
        <text class="in-sub" x="66" y="80">your code</text>

        <rect class="in-box" x="24" y="100" width="176" height="44" rx="7"/>
        <rect class="swatch-sys" x="36" y="112" width="20" height="20" rx="4"/>
        <text class="in-label" x="66" y="120">Python interpreter</text>
        <text class="in-sub" x="66" y="136">so players need no install</text>

        <rect class="in-box" x="24" y="156" width="176" height="44" rx="7"/>
        <rect class="swatch-sys" x="36" y="168" width="20" height="20" rx="4"/>
        <text class="in-label" x="66" y="176">pygame + libraries</text>
        <text class="in-sub" x="66" y="192">SDL, numpy, dependencies</text>

        <rect class="in-box" x="24" y="212" width="176" height="44" rx="7"/>
        <rect class="swatch-asset" x="36" y="224" width="20" height="20" rx="4"/>
        <text class="in-label" x="66" y="232">assets/</text>
        <text class="in-sub" x="66" y="248">images, sounds, fonts</text>
    </g>

    <!-- arrows into bundler -->
    <path class="arrow" d="M200 66 C 248 66, 250 138, 292 150" marker-end="url(#ah)"/>
    <path class="arrow" d="M200 122 C 248 122, 258 146, 292 150" marker-end="url(#ah)"/>
    <path class="arrow" d="M200 178 C 248 178, 258 154, 292 150" marker-end="url(#ah)"/>
    <path class="arrow" d="M200 234 C 248 234, 250 162, 292 150" marker-end="url(#ah)"/>

    <!-- bundler -->
    <rect class="bundler" x="296" y="112" width="150" height="78" rx="12"/>
    <text class="bundler-label" x="371" y="146" text-anchor="middle">PyInstaller</text>
    <text class="bundler-sub" x="371" y="166" text-anchor="middle">/ Nuitka / cx_Freeze</text>
    <text class="bundler-sub" x="371" y="181" text-anchor="middle">the bundler</text>

    <!-- arrow to output -->
    <path class="arrow" d="M446 151 L 512 151" marker-end="url(#ah)"/>

    <!-- output -->
    <rect class="out-box" x="520" y="110" width="176" height="82" rx="12"/>
    <text class="out-label" x="608" y="145" text-anchor="middle">game.exe</text>
    <text class="out-sub" x="608" y="168" text-anchor="middle">one standalone file</text>
    <text class="out-sub" x="608" y="183" text-anchor="middle">double-click and play</text>

    <text class="caption" x="360" y="296" text-anchor="middle">Bundling copies the interpreter and every dependency inside &#8212; the player needs no Python installed.</text>
    <text class="caption" x="360" y="318" text-anchor="middle">That is why the output is tens of megabytes: you are shipping a whole runtime, not just your script.</text>
</svg>
