<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sh-title sh-desc">
    <title id="sh-title">A shader runs once per pixel, all in parallel</title>
    <desc id="sh-desc">On the left, a code box labelled fragment shader lists its inputs — uv, the pixel position, and t, time — and its one line of work, color equals f of uv and t, producing an output pixel. A thick arrow labelled one program, every pixel, in parallel points to the right, where a grid of thirty-two pixels is filled with a smooth diagonal gradient from blue through green to amber, representing the finished screen. A badge reads all 32 at once. The caption contrasts a CPU loop that colours pixels one at a time with the GPU running the same tiny program on thousands of pixels simultaneously.</desc>

    <style>
        :root {
            --card: #f8fafc;
            --card-stroke: #cbd5e1;
            --header: #e2e8f0;
            --code: rgb(30, 41, 59);
            --code-key: #2563eb;
            --grid-line: #f8fafc;
            --arrow: #3b82f6;
            --badge-bg: #f59e0b;
            --badge-text: #ffffff;
            --g1: #3b82f6;
            --g2: #10b981;
            --g3: #f59e0b;
            --text: rgb(30, 41, 59);
            --sub-text: rgb(71, 85, 105);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --card: #1e293b;
                --card-stroke: #475569;
                --header: #334155;
                --code: #e2e8f0;
                --code-key: #60a5fa;
                --grid-line: #0f172a;
                --arrow: #569cd6;
                --badge-bg: #fbbf24;
                --badge-text: #0f172a;
                --g1: #569cd6;
                --g2: #34d399;
                --g3: #fbbf24;
                --text: #f1f5f9;
                --sub-text: #cbd5e1;
            }
        }
        .title { fill: var(--text); font: 700 16px ui-sans-serif, system-ui, sans-serif; }
        .card { fill: var(--card); stroke: var(--card-stroke); stroke-width: 1.5; }
        .header { fill: var(--header); }
        .hdr-txt { fill: var(--sub-text); font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.03em; }
        .code { fill: var(--code); font: 600 14px ui-monospace, Consolas, monospace; }
        .key { fill: var(--code-key); font: 700 14px ui-monospace, Consolas, monospace; }
        .grid-line { stroke: var(--grid-line); stroke-width: 1.5; fill: none; }
        .arrow { stroke: var(--arrow); stroke-width: 6; fill: none; stroke-linecap: round; }
        .arrow-head { fill: var(--arrow); }
        .arrow-lbl { fill: var(--arrow); font: 700 12px ui-sans-serif, system-ui, sans-serif; }
        .badge-bg { fill: var(--badge-bg); }
        .badge-txt { fill: var(--badge-text); font: 800 12px ui-sans-serif, system-ui, sans-serif; }
        .s1 { stop-color: var(--g1); }
        .s2 { stop-color: var(--g2); }
        .s3 { stop-color: var(--g3); }
        .cap { fill: var(--sub-text); font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    </style>

    <defs>
        <linearGradient id="shaderGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"   class="s1"/>
            <stop offset="0.5" class="s2"/>
            <stop offset="1"   class="s3"/>
        </linearGradient>
    </defs>

    <text class="title" x="360" y="32" text-anchor="middle">A shader runs once per pixel &#8212; all at the same time</text>

    <!-- code box -->
    <rect class="card" x="45" y="80" width="275" height="150" rx="8"/>
    <rect class="header" x="45" y="80" width="275" height="28" rx="8"/>
    <rect class="header" x="45" y="94" width="275" height="14"/>
    <text class="hdr-txt" x="60" y="99">fragment shader</text>
    <text class="code" x="62" y="134"><tspan class="key">uv</tspan>    = pixel position</text>
    <text class="code" x="62" y="160"><tspan class="key">t</tspan>     = time</text>
    <text class="code" x="62" y="192"><tspan class="key">color</tspan> = f(uv, t)</text>
    <text class="cap"  x="62" y="216">&#8594; the pixel&#8217;s output colour</text>

    <!-- arrow -->
    <path class="arrow" d="M334 155 L394 155"/>
    <path class="arrow-head" d="M394 145 L414 155 L394 165 Z"/>
    <text class="arrow-lbl" x="374" y="128" text-anchor="middle">one program,</text>
    <text class="arrow-lbl" x="374" y="190" text-anchor="middle">every pixel,</text>
    <text class="arrow-lbl" x="374" y="206" text-anchor="middle">in parallel</text>

    <!-- output pixel grid: 8 cols x 4 rows, cell 30, at x=430 y=95 -->
    <rect x="430" y="95" width="240" height="120" rx="4" fill="url(#shaderGrad)"/>
    <g class="grid-line">
        <line x1="460" y1="95" x2="460" y2="215"/>
        <line x1="490" y1="95" x2="490" y2="215"/>
        <line x1="520" y1="95" x2="520" y2="215"/>
        <line x1="550" y1="95" x2="550" y2="215"/>
        <line x1="580" y1="95" x2="580" y2="215"/>
        <line x1="610" y1="95" x2="610" y2="215"/>
        <line x1="640" y1="95" x2="640" y2="215"/>
        <line x1="430" y1="125" x2="670" y2="125"/>
        <line x1="430" y1="155" x2="670" y2="155"/>
        <line x1="430" y1="185" x2="670" y2="185"/>
        <rect x="430" y="95" width="240" height="120" rx="4" stroke-width="2"/>
    </g>

    <!-- badge -->
    <rect class="badge-bg" x="486" y="232" width="128" height="24" rx="12"/>
    <text class="badge-txt" x="550" y="248" text-anchor="middle">&#9889; all 32 at once</text>

    <!-- caption -->
    <text class="cap" x="360" y="298" text-anchor="middle">A Python loop colours pixels one at a time and crawls; the GPU runs this same tiny program</text>
    <text class="cap" x="360" y="318" text-anchor="middle">on thousands of pixels simultaneously &#8212; which is why full-screen effects are practically free.</text>
</svg>
