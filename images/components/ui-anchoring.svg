<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ui-title ui-desc">
    <title id="ui-title">HUD elements anchored to screen edges</title>
    <desc id="ui-desc">Two game screens sit side by side over a faint world of sky, ground, and a player. The left screen is wide; the right screen is smaller and narrower. Both carry the same heads-up display: a health bar pinned to the top-left corner, a score pinned to the top-right, an ammo counter pinned to the bottom-left, and a minimap pinned to the bottom-right. Small amber corner brackets mark each anchor. Because every element is anchored to a corner rather than a fixed pixel position, the smaller screen still shows every element correctly placed in its corner.</desc>

    <style>
        :root {
            --screen-bg: #eff6ff;
            --screen-stroke: #3b82f6;
            --sky: #bfdbfe;
            --ground: #86efac;
            --world-player: #64748b;
            --hud: #1e293b;
            --hud-bg: rgba(255,255,255,0.82);
            --hp: #22c55e;
            --hp-track: #cbd5e1;
            --anchor: #f59e0b;
            --text: rgb(30, 41, 59);
            --sub-text: rgb(71, 85, 105);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --screen-bg: #0f213b;
                --screen-stroke: #569cd6;
                --sky: #1e3a5f;
                --ground: #166534;
                --world-player: #94a3b8;
                --hud: #f1f5f9;
                --hud-bg: rgba(15,23,42,0.78);
                --hp: #34d399;
                --hp-track: #475569;
                --anchor: #fbbf24;
                --text: #f1f5f9;
                --sub-text: #cbd5e1;
            }
        }
        .title { fill: var(--text); font: 700 16px ui-sans-serif, system-ui, sans-serif; }
        .screen { fill: none; stroke: var(--screen-stroke); stroke-width: 2.5; }
        .sky { fill: var(--sky); }
        .ground { fill: var(--ground); }
        .player { fill: var(--world-player); }
        .hud-pill { fill: var(--hud-bg); }
        .hud-txt { fill: var(--hud); font: 800 11px ui-sans-serif, system-ui, sans-serif; }
        .hp { fill: var(--hp); }
        .hp-track { fill: var(--hp-track); }
        .anchor { stroke: var(--anchor); stroke-width: 2.5; fill: none; stroke-linecap: round; }
        .panel-lbl { fill: var(--text); font: 700 13px ui-sans-serif, system-ui, sans-serif; }
        .cap { fill: var(--sub-text); font: 500 13px ui-sans-serif, system-ui, sans-serif; }
        .anchor-key { fill: var(--anchor); font: 700 12px ui-sans-serif, system-ui, sans-serif; }
    </style>

    <text class="title" x="360" y="30" text-anchor="middle">A HUD lives in screen space &#8212; anchored to edges, not fixed pixels</text>

    <defs>
        <clipPath id="scrA"><rect x="40" y="64" width="360" height="200" rx="8"/></clipPath>
        <clipPath id="scrB"><rect x="452" y="94" width="228" height="140" rx="8"/></clipPath>
    </defs>

    <!-- ============ Screen A (wide) ============ -->
    <!-- frame x=40 y=64 w=360 h=200 -->
    <g clip-path="url(#scrA)">
        <rect class="sky" x="40" y="64" width="360" height="200"/>
        <rect class="ground" x="40" y="220" width="360" height="44"/>
        <circle class="player" cx="220" cy="206" r="10"/>
    </g>
    <rect class="screen" x="40" y="64" width="360" height="200" rx="8"/>

    <!-- HUD A: health top-left -->
    <rect class="hp-track" x="54" y="78" width="80" height="12" rx="6"/>
    <rect class="hp" x="54" y="78" width="52" height="12" rx="6"/>
    <!-- score top-right -->
    <rect class="hud-pill" x="300" y="76" width="86" height="18" rx="9"/>
    <text class="hud-txt" x="343" y="89" text-anchor="middle">SCORE 1200</text>
    <!-- ammo bottom-left -->
    <rect class="hud-pill" x="54" y="234" width="66" height="18" rx="9"/>
    <text class="hud-txt" x="87" y="247" text-anchor="middle">AMMO 30</text>
    <!-- minimap bottom-right -->
    <rect class="hud-pill" x="350" y="214" width="38" height="38" rx="5"/>
    <text class="hud-txt" x="369" y="237" text-anchor="middle">MAP</text>
    <!-- corner anchor brackets -->
    <path class="anchor" d="M50 90 L50 74 L66 74"/>
    <path class="anchor" d="M390 90 L390 74 L374 74"/>
    <path class="anchor" d="M50 238 L50 254 L66 254"/>
    <path class="anchor" d="M390 238 L390 254 L374 254"/>
    <text class="panel-lbl" x="220" y="284" text-anchor="middle">1920 &#215; 1080</text>

    <!-- ============ Screen B (smaller) ============ -->
    <!-- frame x=452 y=94 w=228 h=140 -->
    <g clip-path="url(#scrB)">
        <rect class="sky" x="452" y="94" width="228" height="140"/>
        <rect class="ground" x="452" y="204" width="228" height="30"/>
        <circle class="player" cx="566" cy="192" r="8"/>
    </g>
    <rect class="screen" x="452" y="94" width="228" height="140" rx="8"/>

    <!-- HUD B: same elements, still in corners -->
    <rect class="hp-track" x="464" y="106" width="64" height="10" rx="5"/>
    <rect class="hp" x="464" y="106" width="42" height="10" rx="5"/>
    <rect class="hud-pill" x="596" y="104" width="72" height="16" rx="8"/>
    <text class="hud-txt" x="632" y="116" text-anchor="middle">SCORE 1200</text>
    <rect class="hud-pill" x="464" y="208" width="58" height="16" rx="8"/>
    <text class="hud-txt" x="493" y="220" text-anchor="middle">AMMO 30</text>
    <rect class="hud-pill" x="638" y="190" width="30" height="30" rx="4"/>
    <text class="hud-txt" x="653" y="209" text-anchor="middle">MAP</text>
    <path class="anchor" d="M460 116 L460 104 L472 104"/>
    <path class="anchor" d="M672 116 L672 104 L660 104"/>
    <path class="anchor" d="M460 212 L460 224 L472 224"/>
    <path class="anchor" d="M672 212 L672 224 L660 224"/>
    <text class="panel-lbl" x="566" y="254" text-anchor="middle">1280 &#215; 720 &#8212; same anchors</text>

    <!-- anchor key -->
    <path class="anchor" d="M300 306 L300 296 L310 296"/>
    <text class="anchor-key" x="318" y="306">= anchor point (corner + offset)</text>

    <!-- caption -->
    <text class="cap" x="360" y="338" text-anchor="middle">Anchor to an edge and offset, never to an absolute pixel &#8212; then the HUD stays correct at any resolution,</text>
    <text class="cap" x="360" y="358" text-anchor="middle">and because it is drawn in screen space it never scrolls away with the game camera.</text>
</svg>
